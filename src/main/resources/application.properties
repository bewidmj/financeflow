spring.application.name=financeflow

# Use the local profile by default for development
spring.profiles.default=local

# JPA configuration shared by profiles
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000

app.kafka.transaction-topic=${KAFKA_TRANSACTION_TOPIC:financeflow.transactions.v1}
app.outbox.enabled=true
app.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:1000}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true